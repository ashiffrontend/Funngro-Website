<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Youth Palettes -->
    <linearGradient id="teenGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="teenGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="teenGradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="teenCardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="100%" stop-color="#131A2A" />
    </linearGradient>
    <filter id="teenGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#22C55E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glowing Neon Orbs -->
  <circle cx="300" cy="240" r="210" fill="#8B5CF6" opacity="0.16" filter="blur(50px)" />
  <circle cx="120" cy="120" r="90" fill="#22C55E" opacity="0.18" filter="blur(40px)" />
  <circle cx="490" cy="380" r="100" fill="#FBBF24" opacity="0.14" filter="blur(40px)" />

  <!-- Main Teen Creator Hub Window -->
  <g filter="url(#teenGlowFilter)">
    <!-- Canvas Shell -->
    <rect x="75" y="65" width="450" height="345" rx="28" fill="url(#teenCardDark)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header Bar with XP & Level Tag -->
    <rect x="75" y="65" width="450" height="64" rx="28" fill="#131A2A" />
    <path d="M75 100H525V129H75z" fill="#131A2A"/>
    
    <!-- Teen Creator Profile -->
    <circle cx="115" cy="97" r="20" fill="url(#teenGradPurple)" />
    <text x="108" y="104" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">R</text>
    <circle cx="128" cy="110" r="6" fill="#22C55E" stroke="#131A2A" stroke-width="2" />
    <text x="146" y="93" font-family="'Poppins', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Riya Sen (16)</text>
    <text x="146" y="110" font-family="'Poppins', sans-serif" font-size="10" fill="#22C55E" font-weight="700">★ Level 4 Teen Prodigy • UI/UX &amp; AI</text>

    <!-- XP Tag -->
    <rect x="415" y="81" width="94" height="32" rx="16" fill="rgba(34, 197, 94, 0.15)" stroke="#22C55E" stroke-width="1" />
    <text x="428" y="102" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#22C55E">⚡ 4,850 XP</text>

    <!-- Featured Completed Client Gig -->
    <rect x="98" y="145" width="404" height="125" rx="20" fill="#0B0F19" stroke="rgba(139, 92, 246, 0.3)" />
    <!-- Project Icon -->
    <rect x="116" y="165" width="42" height="42" rx="12" fill="rgba(139, 92, 246, 0.2)" stroke="#8B5CF6" />
    <path d="M130 180L137 175L144 180V192L137 197L130 192V180Z" fill="#8B5CF6" />
    <text x="170" y="180" font-family="'Poppins', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Web3 Mobile App Redesign</text>
    <text x="170" y="196" font-family="'Poppins', sans-serif" font-size="10" fill="#94A3B8">Client: Apex Studio • 5.0 Star Rating</text>

    <!-- Star Rating in Yellow -->
    <g transform="translate(170, 206)">
      <path d="M6 0L7.8 4.2H12L8.4 6.8L9.8 11L6 8.4L2.2 11L3.6 6.8L0 4.2H4.2L6 0Z" fill="#FBBF24"/>
      <path d="M20 0L21.8 4.2H26L22.4 6.8L23.8 11L20 8.4L16.2 11L17.6 6.8L14 4.2H18.2L20 0Z" fill="#FBBF24"/>
      <path d="M34 0L35.8 4.2H40L36.4 6.8L37.8 11L34 8.4L30.2 11L31.6 6.8L28 4.2H32.2L34 0Z" fill="#FBBF24"/>
      <path d="M48 0L49.8 4.2H54L50.4 6.8L51.8 11L48 8.4L44.2 11L45.6 6.8L42 4.2H46.2L48 0Z" fill="#FBBF24"/>
      <path d="M62 0L63.8 4.2H68L64.4 6.8L65.8 11L62 8.4L58.2 11L59.6 6.8L56 4.2H60.2L62 0Z" fill="#FBBF24"/>
    </g>

    <!-- Payout Badge -->
    <rect x="390" y="162" width="96" height="30" rx="15" fill="rgba(34, 197, 94, 0.2)" stroke="#22C55E" />
    <text x="404" y="182" font-family="'Poppins', sans-serif" font-size="12" font-weight="800" fill="#22C55E">+₹5,000</text>

    <!-- Lower Split: Achievements & Rewards Bar -->
    <!-- Left Card: Unlocked Badges -->
    <rect x="98" y="284" width="195" height="106" rx="18" fill="#131A2A" stroke="#334155" />
    <text x="114" y="308" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#8B5CF6">🏆 Unlocked Badges</text>
    
    <g transform="translate(114, 320)">
      <rect x="0" y="0" width="46" height="46" rx="12" fill="rgba(251, 191, 36, 0.15)" stroke="#FBBF24" />
      <text x="14" y="28" font-size="16">🔥</text>
      
      <rect x="56" y="0" width="46" height="46" rx="12" fill="rgba(139, 92, 246, 0.15)" stroke="#8B5CF6" />
      <text x="70" y="28" font-size="16">🚀</text>

      <rect x="112" y="0" width="46" height="46" rx="12" fill="rgba(34, 197, 94, 0.15)" stroke="#22C55E" />
      <text x="126" y="28" font-size="16">💎</text>
    </g>

    <!-- Right Card: Earnings Target -->
    <rect x="307" y="284" width="195" height="106" rx="18" fill="#131A2A" stroke="#334155" />
    <text x="323" y="308" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#FBBF24">💰 Weekly Payouts</text>
    <text x="323" y="336" font-family="'Poppins', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">₹24,500</text>
    <text x="323" y="354" font-family="'Poppins', sans-serif" font-size="9" fill="#22C55E" font-weight="700">↑ 100% Direct Bank / UPI Transfer</text>
    <rect x="323" y="364" width="163" height="6" rx="3" fill="#334155" />
    <rect x="323" y="364" width="138" height="6" rx="3" fill="url(#teenGradGreen)" />
  </g>

  <!-- Floating Sticker Badges in 3D -->
  <!-- Floating Top Left: Code / Laptop -->
  <g filter="url(#badgeGlow)">
    <rect x="25" y="24" width="160" height="52" rx="26" fill="#1E2638" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="52" cy="50" r="16" fill="url(#teenGradPurple)" />
    <!-- Laptop symbol -->
    <path d="M45 46H59V53H45V46ZM42 54H62V56H42V54Z" fill="#FFFFFF" />
    <text x="76" y="44" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Real Projects</text>
    <text x="76" y="58" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#A78BFA">Build Portfolio</text>
  </g>

  <!-- Floating Top Right: Rocket / Instant Payout -->
  <g filter="url(#badgeGlow)">
    <rect x="415" y="16" width="165" height="52" rx="26" fill="#1E2638" stroke="#22C55E" stroke-width="2" />
    <circle cx="442" cy="42" r="16" fill="url(#teenGradGreen)" />
    <!-- Checkmark -->
    <path d="M436 42L440 46L448 38" stroke="#0B0F19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="466" y="36" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Instant Cash</text>
    <text x="466" y="50" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#22C55E">UPI Secured</text>
  </g>

  <!-- Floating Bottom Left: Gold Coins -->
  <g filter="url(#badgeGlow)">
    <rect x="18" y="340" width="165" height="52" rx="26" fill="#1E2638" stroke="#FBBF24" stroke-width="2" />
    <circle cx="45" cy="366" r="16" fill="url(#teenGradYellow)" />
    <text x="39" y="373" font-size="16">🪙</text>
    <text x="70" y="360" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Earn Money</text>
    <text x="70" y="374" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#FBBF24">₹2.5k - ₹15k/mo</text>
  </g>

  <!-- Floating Bottom Right: Yellow Stars & Trophy -->
  <g filter="url(#badgeGlow)">
    <rect x="410" y="340" width="170" height="52" rx="26" fill="#1E2638" stroke="#FBBF24" stroke-width="2" />
    <circle cx="438" cy="366" r="16" fill="url(#teenGradPurple)" />
    <text x="430" y="373" font-size="16">✨</text>
    <text x="462" y="360" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Certificates</text>
    <text x="462" y="374" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#8B5CF6">Govt &amp; Industry</text>
  </g>

  <!-- Playful Decorative Dots & Sparkles -->
  <circle cx="28" cy="200" r="4" fill="#22C55E" />
  <circle cx="570" cy="180" r="5" fill="#8B5CF6" />
  <circle cx="560" cy="280" r="4" fill="#FBBF24" />
  <rect x="40" y="270" width="8" height="8" rx="2" fill="#8B5CF6" transform="rotate(30 44 274)" />
</svg>
